<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/monitoring.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#37BC9B" />
  <link rel="stylesheet" href="./src/index.css">
  <title>Bobo's Command Center</title>

  <style>
    body {
        margin: 0;
        font-family: 'Kanit', sans-serif;
        background: #000510;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: radial-gradient(ellipse at 50% 40%, #12173f 0%, #070b1f 55%, #000510 100%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #app-loader.loader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-drone-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      animation: droneHover 2.4s ease-in-out infinite;
    }

    @keyframes droneHover {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .loader-drone-glow {
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 179, 237, 0.28), transparent 70%);
      filter: blur(12px);
      animation: glowPulse 2.4s ease-in-out infinite;
    }

    @keyframes glowPulse {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .rotor {
      animation: rotorSpin 0.35s linear infinite;
    }

    @keyframes rotorSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      color: rgba(226, 232, 240, 0.85);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      font-weight: 300;
    }

    .loader-dots span {
      display: inline-block;
      animation: dotBlink 1.4s infinite;
      opacity: 0;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotBlink {

      0%,
      80%,
      100% {
        opacity: 0;
      }

      40% {
        opacity: 1;
      }
    }

    .loader-bar {
      width: 160px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .loader-bar-fill {
      height: 100%;
      width: 40%;
      border-radius: 2px;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      animation: barSlide 1.3s ease-in-out infinite;
    }

    @keyframes barSlide {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(360%);
      }
    }
  </style>
</head>

<body>
  <div id="app-loader">
    <div class="loader-drone-wrap">
      <div class="loader-drone-glow"></div>
      <svg viewBox="0 0 100 100" width="88" height="88">
        <defs>
          <linearGradient id="droneGrad" x1="0" y1="0" x2="100" y2="100">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
        <g stroke="url(#droneGrad)" stroke-width="2.5" fill="none" stroke-linecap="round">
          <line x1="30" y1="30" x2="70" y2="70" />
          <line x1="70" y1="30" x2="30" y2="70" />
        </g>
        <circle cx="50" cy="50" r="7" fill="url(#droneGrad)" />
        <g class="rotor" style="transform-origin:30px 30px;">
          <circle cx="30" cy="30" r="10" fill="none" stroke="rgba(147,197,253,0.55)" stroke-width="1.5" />
          <line x1="20" y1="30" x2="40" y2="30" stroke="rgba(147,197,253,0.8)" stroke-width="1.5" />
        </g>
        <g class="rotor" style="transform-origin:70px 30px; animation-delay:-0.1s;">
          <circle cx="70" cy="30" r="10" fill="none" stroke="rgba(147,197,253,0.55)" stroke-width="1.5" />
          <line x1="60" y1="30" x2="80" y2="30" stroke="rgba(147,197,253,0.8)" stroke-width="1.5" />
        </g>
        <g class="rotor" style="transform-origin:70px 70px; animation-delay:-0.2s;">
          <circle cx="70" cy="70" r="10" fill="none" stroke="rgba(147,197,253,0.55)" stroke-width="1.5" />
          <line x1="60" y1="70" x2="80" y2="70" stroke="rgba(147,197,253,0.8)" stroke-width="1.5" />
        </g>
        <g class="rotor" style="transform-origin:30px 70px; animation-delay:-0.3s;">
          <circle cx="30" cy="70" r="10" fill="none" stroke="rgba(147,197,253,0.55)" stroke-width="1.5" />
          <line x1="20" y1="70" x2="40" y2="70" stroke="rgba(147,197,253,0.8)" stroke-width="1.5" />
        </g>
        <circle cx="50" cy="50" r="3" fill="#f87171">
          <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite" />
        </circle>
      </svg>
    </div>
    <div class="loader-text">กำลังเตรียมระบบ<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <div class="loader-bar">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <div id="root" style="width: 100vw; height: 100vh;" class="parent-container"></div>

  <script>
    (function () {
      var root = document.getElementById('root');
      var loader = document.getElementById('app-loader');

      function hideLoader() {
        loader.classList.add('loader-hidden');
        setTimeout(function () { loader.remove(); }, 600);
      }

      var observer = new MutationObserver(function () {
        if (root.children.length > 0) {
          hideLoader();
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true });

      window.addEventListener('load', function () { setTimeout(hideLoader, 5000); });
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
