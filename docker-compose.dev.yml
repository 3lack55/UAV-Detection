name: uav-detection-dev

services:
  mysql:
    image: mysql:5.7
    container_name: uav_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: uav_detection
      MYSQL_USER: bobo
      MYSQL_PASSWORD: "000000000"
    ports:
      - "13306:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - uav-net-dev

  backend:
    build:
      context: ./UAV-Detection-backend
      dockerfile: Dockerfile.dev
    container_name: uav_backend_dev
    environment:
      NODE_ENV: development
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_DATABASE: uav_detection
      MYSQL_USER: bobo
      MYSQL_PASSWORD: "000000000"
      JWT_SECRET: dev-secret-not-for-production
    ports:
      - "3000:3000"
    volumes:
      - ./UAV-Detection-backend:/app
      - backend-node-modules-dev:/app/node_modules
      - ./UAV-Detection-backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - uav-net-dev

  frontend:
    build:
      context: ./UAV-Detection-frontend
      dockerfile: Dockerfile.dev
    container_name: uav_frontend_dev
    environment:
      VITE_API_HOST: localhost
      VITE_API_PORT: 3000
      VITE_API_PROTOCOL: http
      VITE_WS_PROTOCOL: ws
    ports:
      - "5173:5173"
    volumes:
      - ./UAV-Detection-frontend:/app
      - frontend-node-modules-dev:/app/node_modules
    depends_on:
      - backend
    networks:
      - uav-net-dev

volumes:
  mysql-data-dev:
  backend-node-modules-dev:
  frontend-node-modules-dev:

networks:
  uav-net-dev:
